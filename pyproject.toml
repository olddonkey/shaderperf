[project]
name = "shaderperf"
version = "0.0.1"
description = "Measurement harness for ShaderPerf: honest shader optimization under perceptual equivalence"
requires-python = ">=3.12"
dependencies = [
    "wgpu>=0.19",
    "numpy>=2.0",
    "flip-evaluator>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shaderperf"]
